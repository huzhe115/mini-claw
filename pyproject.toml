[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "mini-claw"
version = "0.4.0"
description = "从 0 到 1 复刻 OpenClaw 的常驻私人 AI 助手(FastAPI 网关 + Agent 大脑)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI 依赖注入的标准写法就是 Depends() 放参数默认值,官方文档如此
# BLE001: 工具/LLM 等外部边界的失败必须宽捕获并降级为错误消息,这里宽捕获是刻意的
# DTZ001/DTZ005: datetime.now() 取的是用户本地墙上时间(报时、算提醒差值),naive 是语义要求
ignore = ["B008", "BLE001", "DTZ001", "DTZ005"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
