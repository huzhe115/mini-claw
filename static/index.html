<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Claw</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         display: flex; height: 100vh; background: #f5f6f8; color: #1f2328; }

  /* ---- 侧栏 ---- */
  aside { width: 260px; background: #1e1e2e; color: #cfd3dc; display: flex;
          flex-direction: column; flex-shrink: 0; }
  .brand { padding: 18px 16px 10px; font-size: 20px; font-weight: 700; color: #fff; }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: #8b90a0; margin-top: 2px; }
  #new-session { margin: 8px 12px; padding: 9px; border: 1px solid #3a3f52; border-radius: 8px;
                 background: #2a2e42; color: #fff; cursor: pointer; font-size: 14px; }
  #new-session:hover { background: #353a52; }
  #sessions { list-style: none; overflow-y: auto; flex: 1; }
  #sessions li { padding: 10px 16px; cursor: pointer; font-size: 13px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 border-left: 3px solid transparent; }
  #sessions li:hover { background: #2a2e42; }
  #sessions li.active { background: #2a2e42; border-left-color: #6c8cff; color: #fff; }
  .token-box { padding: 12px; border-top: 1px solid #3a3f52; font-size: 12px; }
  .token-box input { width: 100%; padding: 7px 8px; border: 1px solid #3a3f52; border-radius: 6px;
                     background: #14151f; color: #cfd3dc; font-size: 12px; margin-bottom: 6px; }
  .token-box button { width: 100%; padding: 6px; border: none; border-radius: 6px;
                      background: #6c8cff; color: #fff; cursor: pointer; font-size: 12px; }
  .token-box .hint { color: #8b90a0; margin-bottom: 6px; }

  /* ---- 定时任务列表(侧栏) ---- */
  .cron-box { padding: 10px 12px; border-top: 1px solid #3a3f52; font-size: 12px;
              max-height: 180px; display: flex; flex-direction: column; }
  .cron-box .cron-title { color: #8b90a0; margin-bottom: 6px; font-size: 11px; }
  #cron-list { list-style: none; overflow-y: auto; }
  #cron-list li { display: flex; align-items: center; gap: 6px; padding: 4px 0;
                  color: #cfd3dc; }
  #cron-list li .job { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; }
  #cron-list li button { border: none; background: none; color: #8b90a0;
                         cursor: pointer; font-size: 14px; padding: 0 4px; }
  #cron-list li button:hover { color: #f0616d; }
  #cron-list li.empty { color: #666b7a; }

  /* ---- 聊天区 ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex;
              flex-direction: column; gap: 12px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; font-size: 14px;
         line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #6c8cff; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e3e5ea; }
  .msg.error { align-self: flex-start; background: #fdecea; border: 1px solid #f5c6c0; color: #b42318; }
  .msg.cron { align-self: center; background: #fff8e1; border: 1px dashed #e6c56c;
              color: #8a6d1a; font-size: 12px; padding: 6px 14px; }
  .msg.thinking { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .msg.thinking span { width: 7px; height: 7px; border-radius: 50%; background: #8b90a0;
                       animation: blink 1.2s infinite; }
  .msg.thinking span:nth-child(2) { animation-delay: .2s; }
  .msg.thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .msg .meta { display: block; font-size: 11px; color: #8b90a0; margin-top: 6px; }
  .assistant-box { align-self: flex-start; max-width: 72%; display: flex;
                   flex-direction: column; gap: 8px; }
  .assistant-box .msg { max-width: 100%; }
  details.tool { background: #eef0f5; border: 1px solid #dfe2ea; border-radius: 8px;
                 padding: 6px 10px; font-size: 12px; color: #444b57; }
  details.tool summary { cursor: pointer; font-family: ui-monospace, Consolas, monospace;
                         color: #57606a; }
  details.tool pre { margin-top: 6px; white-space: pre-wrap; word-break: break-all;
                     max-height: 200px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; }

  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #e3e5ea;
         background: #fff; }
  textarea { flex: 1; resize: none; height: 52px; padding: 12px; border: 1px solid #d4d8e0;
             border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; }
  textarea:focus { border-color: #6c8cff; }
  button#send { width: 88px; border: none; border-radius: 10px; background: #6c8cff;
                color: #fff; font-size: 14px; cursor: pointer; }
  button#send:disabled { background: #b9c2f5; cursor: not-allowed; }

  /* ---- 左上角等待队列:排队横幅 + 一次性提醒任务 ---- */
  #corner { position: fixed; top: 12px; left: 272px; z-index: 10; display: none;
            max-width: 60%; background: #fff8e1; border: 1px dashed #e6c56c;
            color: #8a6d1a; padding: 9px 14px; border-radius: 8px; font-size: 13px; }
  #corner .corner-item { padding: 3px 0; }
  #corner .corner-item + .corner-item { border-top: 1px dashed #e6c56c; }
</style>
</head>
<body>
<aside>
  <div class="brand">🦀 Mini-Claw<small>常驻私人 AI 助手 · v0.4</small></div>
  <button id="new-session">＋ 新会话</button>
  <ul id="sessions"></ul>
  <div class="cron-box">
    <div class="cron-title">⏰ 定时任务</div>
    <ul id="cron-list"><li class="empty">加载中…</li></ul>
  </div>
  <div class="token-box">
    <div class="hint">Gateway Token(值在 .env 的 GATEWAY_TOKEN;没配过启动日志里会亮出来)</div>
    <input id="token" type="password" placeholder="X-Gateway-Token">
    <button id="save-token">保存 Token</button>
  </div>
</aside>
<div id="corner"></div>
<main>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="发消息给 Mini-Claw…(Enter 发送,Shift+Enter 换行)"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</main>

<script>
const TOKEN_KEY = 'mini_claw_token';
let token = localStorage.getItem(TOKEN_KEY) || '';
let currentSession = null;
let streaming = false;

const $ = (sel) => document.querySelector(sel);
const messagesEl = $('#messages');

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'X-Gateway-Token': token, ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.detail || `HTTP ${res.status}`);
  }
  return res;
}

function msgEl(text, cls) {
  const div = document.createElement('div');
  div.className = `msg ${cls}`;
  div.textContent = text;
  return div;
}

function toolEl(name, input, output) {
  const d = document.createElement('details');
  d.className = 'tool';
  d.open = false;
  const sum = document.createElement('summary');
  sum.textContent = `🔧 ${name}(${JSON.stringify(input)})`;
  const pre = document.createElement('pre');
  pre.textContent = output || '…';
  d.append(sum, pre);
  return d;
}

// 渲染一条展示消息:user 是纯文本,assistant 是步骤列表(文本步 + 工具步),
// cron 是报时员主动发起的任务,居中显示成小标签
function renderMessage(m) {
  if (m.role === 'user') {
    messagesEl.append(msgEl(m.content, 'user'));
    return;
  }
  if (m.role === 'cron' || m.role === 'reminder') {
    messagesEl.append(msgEl('⏰ 定时任务: ' + m.content, 'cron'));
    return;
  }
  const box = document.createElement('div');
  box.className = 'assistant-box';
  for (const st of (m.steps || [])) {
    if (st.type === 'text') box.append(msgEl(st.content, 'assistant'));
    else box.append(toolEl(st.name, st.input, st.output));
  }
  messagesEl.append(box);
}

function renderHistory(history) {
  messagesEl.innerHTML = '';
  for (const m of history) renderMessage(m);
  scrollBottom();
}

async function loadSessions(selectId) {
  const res = await api('/api/sessions');
  const list = await res.json();
  const ul = $('#sessions');
  ul.innerHTML = '';
  for (const s of list) {
    const li = document.createElement('li');
    li.textContent = s.title;
    li.dataset.id = s.id;
    if (s.id === (selectId || currentSession)) li.classList.add('active');
    li.onclick = () => selectSession(s.id);
    ul.append(li);
  }
  loadCronJobs().catch(() => {});  // 顺带刷新定时任务列表
}

async function loadCronJobs() {
  const res = await api('/api/cron');
  const jobs = await res.json();
  const ul = $('#cron-list');
  ul.innerHTML = '';
  if (!jobs.length) {
    ul.innerHTML = '<li class="empty">没有定时任务</li>';
    return;
  }
  for (const j of jobs) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.className = 'job';
    span.textContent = `${j.schedule} · ${j.prompt}`;
    span.title = `schedule: ${j.schedule}\nprompt: ${j.prompt}`;
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = '删除任务';
    del.onclick = async () => {
      await api(`/api/cron/${j.id}`, { method: 'DELETE' });
      loadCronJobs();
    };
    li.append(span, del);
    ul.append(li);
  }
}

async function selectSession(id) {
  currentSession = id;
  await loadSessions();
  const res = await api(`/api/sessions/${id}/messages`);
  renderHistory(await res.json());
}

async function newSession() {
  const res = await api('/api/sessions', { method: 'POST' });
  const s = await res.json();
  await loadSessions(s.id);
  await selectSession(s.id);
}

// ---- 思考转圈:乐观 UI 的一部分,模型吐出第一个字就撤 ----
let thinking = null;
function showThinking() {
  thinking = document.createElement('div');
  thinking.className = 'msg assistant thinking';
  thinking.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.append(thinking);
}
function hideThinking() {
  if (thinking) { thinking.remove(); thinking = null; }
}

// ---- 左上角等待队列:排队横幅 + 一次性提醒任务,共用这个框 ----
const corner = { queued: null, reminders: [] };
let lastReminderCount = 0;

function renderCorner() {
  const el = $('#corner');
  const parts = [];
  if (corner.queued) {
    parts.push(`<div class="corner-item">⏳ 排队中:「${corner.queued.task}」` +
               `会话正忙,最多再等 ${corner.queued.left}s,完成后自动继续</div>`);
  }
  for (const r of corner.reminders) {
    parts.push(`<div class="corner-item">⏰ 提醒:「${r.message}」还剩 ${r.left}s</div>`);
  }
  if (!parts.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = parts.join('');
  el.style.display = 'block';
}

function cornerTick() {  // 每秒走一格倒计时
  if (corner.queued) corner.queued.left = Math.max(0, corner.queued.left - 1);
  for (const r of corner.reminders) r.left = Math.max(0, r.left - 1);
  renderCorner();
}

async function pollReminders() {  // 每 2 秒拉一次等待队列
  if (!token) return;
  try {
    const res = await api('/api/reminders');
    corner.reminders = await res.json();
    // 有任务刚触发(列表从有变无)且不在流式接收中:刷新历史,让提醒消息上屏
    if (lastReminderCount > 0 && !corner.reminders.length && !streaming) {
      await loadSessions();
      if (currentSession) await selectSession(currentSession);
    }
    lastReminderCount = corner.reminders.length;
    renderCorner();
  } catch (e) { /* 轮询失败静默,下个周期再试 */ }
}
setInterval(cornerTick, 1000);
setInterval(pollReminders, 2000);
pollReminders();

// ---- SSE:fetch 读响应流,按 "\n\n" 切帧解析 data: 行 ----
function handleEvent(ev, live) {
  if (ev.type === 'queued') {
    corner.queued = { task: ev.task, left: ev.wait };
    renderCorner();
    // 排队不是"处理中":放开发送键,倒计时期间还能继续发消息(下一条也排队)
    streaming = false;
    $('#send').disabled = false;
    return;
  }
  corner.queued = null;
  if (ev.type === 'user_msg') {
    // 用户气泡已经在发送瞬间乐观画好,这帧只用来对齐服务端,不再画一遍
  } else if (ev.type === 'delta') {
    hideThinking();
    if (!live.box) {
      live.box = document.createElement('div');
      live.box.className = 'assistant-box';
      messagesEl.append(live.box);
    }
    if (!live.textEl) {
      live.textEl = msgEl('', 'assistant');
      live.box.append(live.textEl);
    }
    live.textEl.textContent += ev.text;  // 打字机
  } else if (ev.type === 'tool') {
    hideThinking();
    if (!live.box) { live.box = document.createElement('div'); live.box.className = 'assistant-box'; messagesEl.append(live.box); }
    live.toolEl = toolEl(ev.name, ev.input, '');
    live.box.append(live.toolEl);
    live.textEl = null;  // 工具之后的新文本开新气泡
  } else if (ev.type === 'tool_result') {
    if (live.toolEl) live.toolEl.querySelector('pre').textContent = ev.output;
  } else if (ev.type === 'done') {
    hideThinking();  // 极端情况:模型一个字没吐就结束
    const meta = document.createElement('span');
    meta.className = 'meta';
    if (ev.usage) meta.textContent = `tokens: ${ev.usage.input_tokens} in / ${ev.usage.output_tokens} out`;
    (live.textEl || live.box)?.append(meta);
  } else if (ev.type === 'error') {
    hideThinking();
    messagesEl.append(msgEl('出错了: ' + ev.detail, 'error'));
  }
  scrollBottom();
}

async function sendMessage(text) {
  const res = await api(`/api/sessions/${currentSession}/chat/stream`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: text }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.detail || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  const live = { box: null, textEl: null, toolEl: null };
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of frame.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        handleEvent(JSON.parse(line.slice(6)), live);
      }
    }
  }
}

// ---- 事件绑定 ----
$('#composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = $('#input');
  const text = input.value.trim();
  if (!text || !currentSession || streaming) return;
  streaming = true;
  $('#send').disabled = true;
  input.value = '';
  // 乐观 UI:气泡和转圈立刻上屏,不等服务端任何回包,发送观感 = 秒发
  messagesEl.append(msgEl(text, 'user'));
  showThinking();
  scrollBottom();
  try {
    await sendMessage(text);
    await loadSessions();  // 标题可能已更新
  } catch (err) {
    hideThinking();
    if (err.message.includes('处理上一条')) alert('该会话正在处理上一条消息,请稍候再发');
    else messagesEl.append(msgEl('出错了: ' + err.message, 'error'));
  } finally {
    streaming = false;
    $('#send').disabled = false;
    corner.queued = null;
    renderCorner();
    scrollBottom();
  }
});

$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    $('#composer').requestSubmit();
  }
});

$('#new-session').onclick = newSession;
$('#save-token').onclick = () => {
  token = $('#token').value.trim();
  localStorage.setItem(TOKEN_KEY, token);
  $('#token').value = '';
  loadSessions().catch((err) => alert('Token 不对: ' + err.message));
};
$('#token').value = token;

// ---- 启动 ----
(async () => {
  if (!token) { alert('先在左下角填写 Gateway Token(见 .env 的 GATEWAY_TOKEN)'); return; }
  try {
    await loadSessions();
    const res = await api('/api/sessions');
    const list = await res.json();
    if (list.length) await selectSession(list[0].id);
  } catch (err) {
    messagesEl.append(msgEl('连不上网关: ' + err.message, 'error'));
  }
})();
</script>
</body>
</html>
